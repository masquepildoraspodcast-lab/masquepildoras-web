<script async src="https://www.googletagmanager.com/gtag/js?id=G-LZ5ZWD5HXR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  /* Tráfico interno: abrir la web con ?interno=1 marca este dispositivo (?interno=0 lo desmarca) */
  var mqpInterno=false;
  try{var q=location.search;
    if(/[?&]interno=1/.test(q))localStorage.setItem('mqp_interno','1');
    if(/[?&]interno=0/.test(q))localStorage.removeItem('mqp_interno');
    mqpInterno=localStorage.getItem('mqp_interno')==='1';}catch(e){}
  if(mqpInterno)gtag('set',{traffic_type:'internal'});
  gtag('config', 'G-LZ5ZWD5HXR', mqpInterno?{traffic_type:'internal'}:{});
</script>
<style>
:root{--navy:#0d1f4e;--blue:#1a3a8f;--accent:#2d6fd4;--gold:#c9a84c;--white:#fff;--sky4:#f7fbff;--muted:#4a6090;--border:rgba(13,31,78,0.1);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--sky4);color:#2b3d63;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:28px 18px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:20px;box-shadow:0 20px 60px rgba(13,31,78,0.10);max-width:520px;width:100%;padding:40px 36px;text-align:center;}
.check{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 20px;}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:28px;color:var(--navy);margin-bottom:12px;line-height:1.15;}
p{font-size:16px;margin-bottom:22px;}
.btn{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-weight:700;font-size:16px;padding:16px 30px;border-radius:12px;text-decoration:none;transition:transform .2s,box-shadow .2s;}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(13,31,78,0.22);}
.small{font-size:13px;color:var(--muted);margin-top:18px;}
.small a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="check">&#10003;</div>
  <h1>¡Gracias! Tu guía está lista</h1>
  <p>Hemos guardado tus datos. Descarga ahora la <strong>Guía para entrar en la industria farmacéutica</strong>.</p>
  <a class="btn" href="/recursos/guia-para-entrar-en-la-industria-farmaceutica.pdf" target="_blank" rel="noopener" download onclick="if(typeof gtag==='function'){gtag('event','guia_descarga',{placement:'gracias'});}">&#11015; Descargar la guía (PDF)</a>
  <p class="small">¿No se descarga? <a href="/recursos/guia-para-entrar-en-la-industria-farmaceutica.pdf" target="_blank" rel="noopener">Haz clic aquí</a>. &nbsp;·&nbsp; <a href="/#eps">Volver a los episodios</a></p>
</div>

if(typeof gtag==='function')gtag('event','guia_lead',{method:'brevo_form'});})();
</script>
